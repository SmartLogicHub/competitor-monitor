name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      TEMP: D:\a\_temp
      TMP: D:\a\_temp
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: competitor_monitor/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python dependencies
        run: python -m pip install -r competitor_monitor/requirements.txt

      - name: Run backend tests
        working-directory: competitor_monitor
        run: python -m unittest discover -s tests -v

      - name: Run frontend static tests
        run: |
          node web_frontend/uiState.test.cjs
          node web_frontend/mockData.test.cjs
          node web_frontend/staticMarkup.test.cjs
          node web_frontend/stylePalette.test.cjs
          node web_frontend/uiStateFillText.test.cjs
